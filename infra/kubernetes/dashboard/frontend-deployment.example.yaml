apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-frontend
  namespace: clickhouse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dashboard-frontend
  template:
    metadata:
      labels:
        app: dashboard-frontend
    spec:
      containers:
      - name: frontend
        image: <account_id>.dkr.ecr.us-east-1.amazonaws.com/dashboard-frontend:latest
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-frontend
  namespace: clickhouse
spec:
  selector:
    app: dashboard-frontend
  ports:
  - port: 80
    targetPort: 80
    name: http
  type: LoadBalancer