apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-backend
  namespace: clickhouse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dashboard-backend
  template:
    metadata:
      labels:
        app: dashboard-backend
    spec:
      containers:
      - name: backend
        image: <account_id>.dkr.ecr.us-east-1.amazonaws.com/dashboard-backend:latest
        ports:
        - containerPort: 3001
          name: http
        env:
        - name: PORT
          value: "3001"
        - name: CLICKHOUSE_HOST
          value: "http://clickhouse-option1:8123"
        - name: CLICKHOUSE_USER
          value: "default"
        - name: CLICKHOUSE_PASSWORD
          value: ""
        - name: CLICKHOUSE_DATABASE
          value: "metrics_s3"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-backend
  namespace: clickhouse
spec:
  selector:
    app: dashboard-backend
  ports:
  - port: 3001
    targetPort: 3001
    name: http
  type: ClusterIP