apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: clickhouse
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 10s
        send_batch_size: 1024

      # Add resource attributes
      resource:
        attributes:
          - key: collector.name
            value: otel-collector
            action: insert

    exporters:
      # File exporter to write JSON to local disk
      file:
        path: /var/log/otel/metrics.json
        rotation:
          max_megabytes: 0.1
          max_days: 1
          max_backups: 100
        format: json

      # Logging exporter for debugging
      logging:
        verbosity: normal
        sampling_initial: 5
        sampling_thereafter: 200

    service:
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [batch, resource]
          exporters: [file, logging]